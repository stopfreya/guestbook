<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Register - Guestbook</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #3d4a6d 0%, #1f2d47 100%);
        }
        .box {
            background: #e8ecf5;
            padding: 30px;
            border-radius: 10px;
            width: 320px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }
        h1 { color: #3d4a6d; margin-bottom: 20px; font-size: 22px; }
        input {
            display: block;
            width: 100%;
            margin-bottom: 12px;
            padding: 12px;
            border: 2px solid #a8b8d8;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: linear-gradient(135deg, #4a5d8a 0%, #2f3d5f 100%);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover {
            background: linear-gradient(135deg, #f5d76e 0%, #d8a31a 100%);
        }
        .error { color: #a83232; margin-bottom: 12px; font-size: 14px; }
        p { margin-top: 16px; font-size: 14px; text-align: center; }
        a { color: #4a5d8a; }
        a:hover { color: #d8a31a; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Create an account</h1>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Register</button>
        </form>
        <p>Have you already got an account? <a href="{{ url_for('login') }}">Login</a></p>
    </div>
</body>
</html>
